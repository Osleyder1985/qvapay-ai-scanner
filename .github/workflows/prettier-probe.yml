name: Prettier probe

on:
  push:
    branches:
      - tmp/prettier-probe

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/worker.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore: format worker with Prettier"
          git push origin HEAD:tmp/prettier-probe
