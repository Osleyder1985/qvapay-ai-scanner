name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - production/cloudflare
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for Cloudflare Workers Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            response="$(curl --fail-with-body --silent --show-error               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2026-03-10"               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=Workers%20Builds%3A%20qvapay-ai-scanner")"

            status="$(printf '%s' "$response" | jq -r '.check_runs[0].status // "missing"')"
            conclusion="$(printf '%s' "$response" | jq -r '.check_runs[0].conclusion // ""')"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Cloudflare Workers Build failed with conclusion: $conclusion"
                exit 1
              fi
              echo "Cloudflare Workers Build completed successfully for $GITHUB_SHA."
              exit 0
            fi

            echo "Waiting for Cloudflare Workers Build for $GITHUB_SHA (attempt $attempt/60; status=$status)."
            sleep 10
          done

          echo "Timed out waiting for the Cloudflare Workers Build check."
          exit 1

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --tag "${{ github.sha }}" --message "GitHub commit ${{ github.sha }}"

      - name: Verify deployment status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name qvapay-ai-scanner --json > deployment-status.json
          npx wrangler deployments list --name qvapay-ai-scanner --json > deployment-list.json

          node <<'NODE'
          const fs = require("node:fs");

          const expectedSha = process.env.GITHUB_SHA;
          const status = JSON.parse(fs.readFileSync("deployment-status.json", "utf8"));
          const deployments = JSON.parse(fs.readFileSync("deployment-list.json", "utf8"));

          const activeVersionIds = (status?.versions ?? [])
            .filter((entry) => Number(entry?.percentage) === 100)
            .map((entry) => entry?.version_id)
            .filter(Boolean);

          if (activeVersionIds.length !== 1) {
            throw new Error(
              `Expected exactly one 100% active Worker version, found ${activeVersionIds.length}.`,
            );
          }

          const deploymentsList = Array.isArray(deployments)
            ? deployments
            : deployments?.deployments ?? deployments?.result?.deployments ?? [];
          const latestDeployment = deploymentsList[0];

          if (!latestDeployment) {
            throw new Error("Cloudflare returned no Worker deployments.");
          }

          const deploymentVersionIds = (latestDeployment.versions ?? [])
            .filter((entry) => Number(entry?.percentage) === 100)
            .map((entry) => entry?.version_id)
            .filter(Boolean);

          if (
            deploymentVersionIds.length !== 1 ||
            deploymentVersionIds[0] !== activeVersionIds[0]
          ) {
            throw new Error(
              `Latest deployment does not match the active 100% Worker version. latest=${JSON.stringify(deploymentVersionIds)}, active=${JSON.stringify(activeVersionIds)}.`,
            );
          }

          const message =
            latestDeployment?.annotations?.["workers/message"] ??
            latestDeployment?.message ??
            "";

          if (!String(message).includes(expectedSha)) {
            throw new Error(
              `Latest Cloudflare deployment ${latestDeployment.id ?? "unknown"} is not traceable to GitHub commit ${expectedSha}; message=${JSON.stringify(message)}.`,
            );
          }

          fs.writeFileSync(
            "deployment-evidence.txt",
            [
              `github_commit=${expectedSha}`,
              `cloudflare_deployment_id=${latestDeployment.id ?? ""}`,
              `cloudflare_version_id=${activeVersionIds[0]}`,
              `cloudflare_deployment_message=${message}`,
              "",
            ].join("\n"),
          );

          console.log(
            `Verified Cloudflare deployment ${latestDeployment.id} and version ${activeVersionIds[0]} are traceable to GitHub commit ${expectedSha}.`,
          );
          NODE

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deployment-evidence-${{ github.sha }}
          path: |
            deployment-status.json
            deployment-versions.json
            deployment-evidence.txt
          if-no-files-found: warn
