name: Deploy and Verify Cloudflare Production

on:
  push:
    branches:
      - production/cloudflare
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name qvapay-ai-scanner --json > pre-deployment-status.json
          previous="$(node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("pre-deployment-status.json","utf8")); const a=(d.versions??[]).filter(v=>Number(v?.percentage)===100).map(v=>v?.version_id).filter(Boolean); process.stdout.write(a.length===1?a[0]:"");')"
          npx wrangler deploy > cloudflare-deploy.txt
          printf '%s\n' "$previous" > cloudflare-previous-version.txt

      - name: Wait for Cloudflare deployment to become active
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          previous="$(cat cloudflare-previous-version.txt)"
          for attempt in {1..30}; do
            npx wrangler deployments status --name qvapay-ai-scanner --json > deployment-status.json
            active="$(node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("deployment-status.json","utf8")); const a=(d.versions??[]).filter(v=>Number(v?.percentage)===100).map(v=>v?.version_id).filter(Boolean); process.stdout.write(a.length===1?a[0]:"");')"
            if [ -n "$active" ] && [ "$active" != "$previous" ]; then
              printf '%s\n' "$active" > cloudflare-deployed-version.txt
              echo "Cloudflare version $active is active at 100%."
              exit 0
            fi
            echo "Waiting for new active Cloudflare version (attempt $attempt/30; previous=$previous; active=$active)."
            sleep 10
          done
          echo "Cloudflare deployment did not become a new single 100% active version."
          exit 1

      - name: Capture managed Cloudflare Build status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=Workers%20Builds%3A%20qvapay-ai-scanner"             > cloudflare-build-check.json || printf '{"check_runs":[]}' > cloudflare-build-check.json

      - name: Write deployment evidence
        run: |
          set -euo pipefail
          active="$(node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("deployment-status.json","utf8")); const a=(d.versions??[]).filter(v=>Number(v?.percentage)===100).map(v=>v?.version_id).filter(Boolean); process.stdout.write(a.length===1?a[0]:"");')"
          build_id="$(jq -r '.check_runs[0].external_id // ""' cloudflare-build-check.json)"
          build_conclusion="$(jq -r '.check_runs[0].conclusion // ""' cloudflare-build-check.json)"
          build_url="$(jq -r '.check_runs[0].details_url // ""' cloudflare-build-check.json)"
          {
            echo "github_commit=$GITHUB_SHA"
            echo "cloudflare_active_version_id=$active"
            echo "cloudflare_deployed_version_id=$(cat cloudflare-deployed-version.txt)"
            echo "cloudflare_build_id=$build_id"
            echo "cloudflare_build_conclusion=$build_conclusion"
            echo "cloudflare_build_url=$build_url"
            echo "deployment_method=wrangler_direct"
          } > deployment-evidence.txt

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deployment-evidence-${{ github.sha }}
          path: |
            cloudflare-deploy.txt
            cloudflare-previous-version.txt
            cloudflare-deployed-version.txt
            cloudflare-build-check.json
            deployment-status.json
            deployment-evidence.txt
          if-no-files-found: warn
