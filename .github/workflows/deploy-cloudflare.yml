name: Verify Cloudflare Production Deployment

on:
  push:
    branches:
      - production/cloudflare
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for Cloudflare Workers Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            response="$(curl --fail-with-body --silent --show-error               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2026-03-10"               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=Workers%20Builds%3A%20qvapay-ai-scanner")"

            status="$(printf '%s' "$response" | jq -r '.check_runs[0].status // "missing"')"
            conclusion="$(printf '%s' "$response" | jq -r '.check_runs[0].conclusion // ""')"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Cloudflare Workers Build failed with conclusion: $conclusion"
                exit 1
              fi
              printf '%s' "$response" > cloudflare-build-check.json
              echo "Cloudflare Workers Build completed successfully for $GITHUB_SHA."
              exit 0
            fi

            echo "Waiting for Cloudflare Workers Build for $GITHUB_SHA (attempt $attempt/60; status=$status)."
            sleep 10
          done

          echo "Timed out waiting for the Cloudflare Workers Build check."
          exit 1

      - name: Verify active production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name qvapay-ai-scanner --json > deployment-status.json

          node <<'NODE'
          const fs = require("node:fs");

          const expectedSha = process.env.GITHUB_SHA;
          const status = JSON.parse(fs.readFileSync("deployment-status.json", "utf8"));

          const activeVersions = (status?.versions ?? [])
            .filter((entry) => Number(entry?.percentage) === 100)
            .map((entry) => entry?.version_id)
            .filter(Boolean);

          if (activeVersions.length !== 1) {
            throw new Error(
              `Expected exactly one 100% active Worker version, found ${activeVersions.length}.`,
            );
          }

          const message =
            status?.annotations?.["workers/message"] ??
            status?.message ??
            "";

          if (!String(message).includes(expectedSha)) {
            throw new Error(
              `Cloudflare deployment ${status?.id ?? "unknown"} is not traceable to GitHub commit ${expectedSha}; message=${JSON.stringify(message)}.`,
            );
          }


          fs.writeFileSync(
            "deployment-evidence.txt",
            [
              `github_commit=${expectedSha}`,
              `cloudflare_build_id=${buildId}`,
              `cloudflare_build_url=${buildUrl}`,
              `cloudflare_check_head_sha=${check.head_sha}`,
              `cloudflare_check_conclusion=${check.conclusion}`,
              `cloudflare_active_version_id=${activeVersionIds[0]}`,
              "",
            ].join("\n"),
          );

          console.log(
            `Verified Cloudflare production build ${buildId} for GitHub commit ${expectedSha}; active version ${activeVersionIds[0]}.`,
          );
          NODE

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deployment-evidence-${{ github.sha }}
          path: |
            cloudflare-build-check.json
            deployment-status.json
            deployment-evidence.txt
          if-no-files-found: warn
