name: Verify Cloudflare Production Deployment

on:
  push:
    branches:
      - production/cloudflare
  workflow_dispatch

permissions:
  contents: read
  checks: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for Cloudflare Workers Build
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=Workers%20Builds%3A%20qvapay-ai-scanner")"

            status="$(printf '%s' "$response" | jq -r '.check_runs[0].status // "missing"')"
            conclusion="$(printf '%s' "$response" | jq -r '.check_runs[0].conclusion // ""')"

            if [ "$status" = "completed" ]; then
              printf '%s' "$response" > cloudflare-build-check.json

              if [ "$conclusion" != "success" ]; then
                build_id="$(printf '%s' "$response" | jq -r '.check_runs[0].external_id // ""')"
                echo "Cloudflare Workers Build failed with conclusion: $conclusion"
                if [ -n "$build_id" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
                  curl --fail-with-body --silent --show-error \
                    -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                    "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/builds/$build_id" \
                    > cloudflare-build.json || true
                  curl --fail-with-body --silent --show-error \
                    -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                    "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/builds/$build_id/logs" \
                    > cloudflare-build-logs.json || true
                  if [ -s cloudflare-build.json ]; then
                    echo "Cloudflare build metadata:"
                    jq '{success,errors,messages,result:{build_outcome,build_uuid,status,build_trigger_metadata,trigger,created_on,modified_on,stopped_on}}' cloudflare-build.json || true
                  fi
                  if [ -s cloudflare-build-logs.json ]; then
                    echo "Cloudflare build logs:"
                    jq -r '.result.lines[]? | if type == "array" then .[-1] else . end' cloudflare-build-logs.json || true
                  fi
                else
                  echo "Cloudflare build diagnostics skipped because the build ID or API credentials are unavailable."
                fi
                exit 1
              fi

              echo "Cloudflare Workers Build completed successfully for $GITHUB_SHA."
              exit 0
            fi

            echo "Waiting for Cloudflare Workers Build for $GITHUB_SHA (attempt $attempt/60; status=$status)."
            sleep 10
          done

          echo "Timed out waiting for the Cloudflare Workers Build check."
          exit 1

      - name: Verify active production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name qvapay-ai-scanner --json > deployment-status.json

          node <<'NODE'
          const fs = require("node:fs");

          const expectedSha = process.env.GITHUB_SHA;
          const status = JSON.parse(fs.readFileSync("deployment-status.json", "utf8"));
          const buildCheck = JSON.parse(
            fs.readFileSync("cloudflare-build-check.json", "utf8"),
          );
          const check = buildCheck?.check_runs?.[0];

          if (!check || check.head_sha !== expectedSha || check.conclusion !== "success") {
            throw new Error(
              `Cloudflare Workers Build check is not a successful build for GitHub commit ${expectedSha}.`,
            );
          }

          const activeVersions = (status?.versions ?? [])
            .filter((entry) => Number(entry?.percentage) === 100)
            .map((entry) => entry?.version_id)
            .filter(Boolean);

          if (activeVersions.length !== 1) {
            throw new Error(
              `Expected exactly one 100% active Worker version, found ${activeVersions.length}.`,
            );
          }

          const summary = String(check.output?.summary ?? "");
          const versionMatch = summary.match(/Version ID:\s*([0-9a-f-]{36})/i);

          if (!versionMatch || versionMatch[1] !== activeVersions[0]) {
            throw new Error(
              `Cloudflare active version ${activeVersions[0]} does not match the version reported by the successful build check.`,
            );
          }

          fs.writeFileSync(
            "deployment-evidence.txt",
            [
              `github_commit=${expectedSha}`,
              `cloudflare_deployment_id=${status?.id ?? ""}`,
              `cloudflare_active_version_id=${activeVersions[0]}`,
              `cloudflare_build_id=${check.external_id ?? ""}`,
              `cloudflare_build_url=${check.details_url ?? ""}`,
              `cloudflare_check_head_sha=${check.head_sha}`,
              `cloudflare_check_conclusion=${check.conclusion}`,
              "",
            ].join("\n"),
          );

          console.log(
            `Verified Cloudflare build ${check.external_id ?? "unknown"} for GitHub commit ${expectedSha}; active version ${activeVersions[0]} matches the build-reported version.`,
          );
          NODE

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deployment-evidence-${{ github.sha }}
          path: |
            cloudflare-build-check.json
            cloudflare-build.json
            cloudflare-build-logs.json
            deployment-status.json
            deployment-evidence.txt
          if-no-files-found: warn
