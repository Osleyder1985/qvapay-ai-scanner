name: Temporary format repair

on:
  push:
    branches:
      - "chore/post-remediation-ci-verification"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/post-remediation-ci-verification

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format tracked TypeScript and project config
        run: npx prettier --write "src/**/*.ts" "package.json" "tsconfig.json"

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json tsconfig.json
          git commit -m "style: apply Prettier formatting"
          git push origin HEAD:chore/post-remediation-ci-verification
