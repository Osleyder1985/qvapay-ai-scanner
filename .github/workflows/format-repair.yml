name: One-time format repair

on:
  push:
    branches:
      - feature/arbitrage-market-history

permissions:
  contents: write

jobs:
  format-repair:
    if: github.ref == 'refs/heads/feature/arbitrage-market-history'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/arbitrage-market-history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format affected TypeScript files
        run: npx prettier --write src/backend/arbitrage-market-history.ts src/cloudflare/arbitrage-event-ingestion.ts src/cloudflare/d1.ts src/tests/arbitrage-event-ingestion.test.ts src/tests/arbitrage-market-history.test.ts

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/arbitrage-market-history.ts src/cloudflare/arbitrage-event-ingestion.ts src/cloudflare/d1.ts src/tests/arbitrage-event-ingestion.test.ts src/tests/arbitrage-market-history.test.ts
          git commit -m "style: format arbitrage history files"
          git push origin HEAD:feature/arbitrage-market-history
