name: format-diagnostic-temp
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/backend/arbitrage-market.ts src/tests/arbitrage-market.test.ts
      - run: git diff -- src/backend/arbitrage-market.ts src/tests/arbitrage-market.test.ts
