name: Temporary runtime formatting

on:
  push:
    branches:
      - feat/cloudflare-worker-auto-apply-runtime

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "src/**/*.ts" "package.json" "tsconfig.json"
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker/index.ts src/worker/auto-apply-runtime.ts src/tests/auto-apply-runtime.test.ts
          git commit -m "style: format Cloudflare runtime migration"
          git push
