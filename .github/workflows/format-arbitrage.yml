name: Format arbitrage monitor

on:
  workflow_dispatch:
  push:
    branches:
      - feat/server-side-arbitrage-monitor

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-side-arbitrage-monitor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "src/**/*.ts" "package.json" "tsconfig.json"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json tsconfig.json
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format arbitrage monitor files"
          git push origin HEAD:feat/server-side-arbitrage-monitor
