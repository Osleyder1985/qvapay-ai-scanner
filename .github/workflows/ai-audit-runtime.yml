name: AI Auditor Runtime Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Validate auditor secret
        env:
          AI_AUDITOR_TOKEN: ${{ secrets.AI_AUDITOR_TOKEN }}
        run: |
          if [ -z "${AI_AUDITOR_TOKEN}" ]; then
            echo "Missing required repository secret: AI_AUDITOR_TOKEN" >&2
            exit 1
          fi

      - name: Collect read-only diagnostics
        env:
          AI_AUDITOR_TOKEN: ${{ secrets.AI_AUDITOR_TOKEN }}
          AI_AUDITOR_BASE_URL: https://qvapay-ai-scanner.osleyder-gonzalez1985.workers.dev
        run: |
          set -eu
          failed=0
          mkdir -p audit-report
          endpoints="health monitor arbitrage database runtime"
          for endpoint in $endpoints; do
            curl --silent --show-error --fail-with-body --location \
              --header "Authorization: Bearer ${AI_AUDITOR_TOKEN}" \
              --header "Accept: application/json" \
              --output "audit-report/${endpoint}.json" \
              "${AI_AUDITOR_BASE_URL}/api/ai-audit/${endpoint}" \
              || failed=1
          done
          unset AI_AUDITOR_TOKEN
          if [ "${failed}" -ne 0 ]; then
            echo "One or more AI Auditor diagnostics endpoints failed." >&2
            exit 1
          fi
          printf '%s\n' 'AI Auditor diagnostics collected from read-only endpoints.' > audit-report/README.txt

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: ai-auditor-runtime-report
          path: audit-report/
          if-no-files-found: error
          retention-days: 3
