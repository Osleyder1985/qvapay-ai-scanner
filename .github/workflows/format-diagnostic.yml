name: Format diagnostic

on:
  push:
    branches:
      - feature/arbitrage-market-history

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/cloudflare/arbitrage-event-ingestion.ts src/cloudflare/arbitrage-history-routes.ts
      - name: Export formatted files
        run: |
          echo "EVENT_INGESTION_BEGIN"
          base64 -w0 src/cloudflare/arbitrage-event-ingestion.ts
          echo
          echo "EVENT_INGESTION_END"
          echo "HISTORY_ROUTES_BEGIN"
          base64 -w0 src/cloudflare/arbitrage-history-routes.ts
          echo
          echo "HISTORY_ROUTES_END"
