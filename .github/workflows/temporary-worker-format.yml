name: Temporary Worker Formatting Helper
# temporary

on:
  push:
    branches:
      - fix/account-balance-response-discovery

permissions:
  contents: write

jobs:
  format-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/account-balance-response-discovery

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Worker
        run: npx prettier --write src/worker.ts

      - name: Commit formatting
        run: |
          if git diff --quiet -- src/worker.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.ts
          git commit -m "style(account): format worker"
          git push origin HEAD:fix/account-balance-response-discovery
