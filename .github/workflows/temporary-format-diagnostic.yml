name: Temporary Format Diagnostic

on:
  push:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/backend/arbitrage-market-history.ts src/tests/arbitrage-event-ingestion.test.ts src/tests/finance-ledger.test.ts
      - run: git diff -- src/backend/arbitrage-market-history.ts src/tests/arbitrage-event-ingestion.test.ts src/tests/finance-ledger.test.ts
