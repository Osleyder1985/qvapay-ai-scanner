name: Format Issue 136 branch

on:
  push:
    branches:
      - fix/136-sanitize-cloudflare-errors

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "src/cloudflare/auth-routes.ts" "src/cloudflare/cloudflare-router.ts" "src/cloudflare/error-contract.ts" "src/cloudflare/arbitrage-monitor-routes.ts"
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloudflare/auth-routes.ts src/cloudflare/cloudflare-router.ts src/cloudflare/error-contract.ts src/cloudflare/arbitrage-monitor-routes.ts
          git commit -m "style: apply Prettier formatting"
          git push
