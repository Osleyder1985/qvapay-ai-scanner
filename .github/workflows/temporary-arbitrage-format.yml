name: Temporary formatter

on:
  push:
    branches:
      - fix/arbitrage-configurable-interval

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arbitrage-configurable-interval
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/cloudflare/arbitrage-monitor.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/cloudflare/arbitrage-monitor.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloudflare/arbitrage-monitor.ts
          git commit -m "style(arbitrage): apply canonical Prettier formatting"
          git push origin HEAD:fix/arbitrage-configurable-interval
