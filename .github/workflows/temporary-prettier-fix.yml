name: Temporary Prettier Fix
on:
  push:
    branches:
      - fix/events-out-of-order-lifecycle
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "src/backend/arbitrage-market-history.ts" "src/tests/arbitrage-market-history.test.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/arbitrage-market-history.ts src/tests/arbitrage-market-history.test.ts
          git commit -m "style: format lifecycle validation"
          git push
