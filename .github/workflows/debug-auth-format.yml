name: Debug auth formatting

on:
  push:
    branches:
      - fix/security-login-rate-limit

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          set -e
          npx prettier --write src/cloudflare/auth-routes.ts src/tests/auth-rate-limit.test.ts
          git diff -- src/cloudflare/auth-routes.ts src/tests/auth-rate-limit.test.ts
