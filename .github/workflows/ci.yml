name: CI

on:
  push:
    branches:
      - production/cloudflare
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Node.js support contract
        run: |
          node -e "const p=require('./package.json'); const range=p.engines?.node; if (range !== '>=22') { console.error('Expected package.json engines.node to be >=22; found:', range); process.exit(1); } if (Number(process.versions.node.split('.')[0]) < 22) { console.error('CI Node.js runtime is below the supported major version:', process.versions.node); process.exit(1); }"
      - name: Verify source documentation language
        run: node scripts/check-source-language.mjs
      - name: Run quality gates
        run: |
          set -o pipefail
          npm run quality 2>&1 | tee quality-output.log
      - name: Run repository governance checks
        run: npm run governance:check
      - name: Run Cloudflare architecture contract
        run: npm run architecture:check
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics-${{ github.sha }}
          path: quality-output.log
          if-no-files-found: ignore
          retention-days: 3

  cloudflare-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Cloudflare local runtime smoke
        run: npm run smoke:cloudflare:local

  production-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production/cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - quality
      - cloudflare-runtime-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture current production version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name qvapay-ai-scanner --json > deployment-before.json
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("deployment-before.json","utf8")); const a=(d.versions??[]).filter(v=>Number(v?.percentage)===100).map(v=>v?.version_id).filter(Boolean); if(a.length>1) throw new Error("Expected at most one active 100% version before deployment."); fs.writeFileSync("cloudflare-previous-version.txt",(a[0]??"")+"\n"); console.log("Previous active version:",a[0]??"none");'

      - name: Verify Cloudflare Worker configuration contract
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const source = fs.readFileSync("wrangler.jsonc", "utf8")
            .replace(/\/\*[\s\S]*?\*\//g, "")
            .replace(/(^|\s)\/\/.*$/gm, "$1")
            .replace(/,\s*([}\]])/g, "$1");
          const config = JSON.parse(source);
          const database = config.d1_databases?.find((entry) => entry?.binding === "DB");
          if (!database || database.database_name !== "qvapay-ai-scanner" || !database.database_id) {
            throw new Error("Required D1 binding DB is missing or misconfigured.");
          }
          const durableObject = config.durable_objects?.bindings?.find((entry) => entry?.name === "ARBITRAGE_MONITOR");
          if (durableObject?.class_name !== "ArbitrageMonitor") {
            throw new Error("Required Durable Object binding is missing or misconfigured.");
          }
          if (!config.triggers?.crons?.includes("* * * * *")) {
            throw new Error("Expected production monitor cron is missing.");
          }
          console.log("Cloudflare Worker configuration contract: PASS");
          NODE
          node -e 'const fs=require("node:fs"); const c=fs.readFileSync("src/cloudflare/auto-apply-routes.ts","utf8"); if(!c.includes("501") || !c.includes("Auto-Apply permanece desactivado en Cloudflare") || !c.includes("Auto-Apply no puede persistir")) throw new Error("Auto-Apply fail-closed contract is missing."); console.log("Auto-Apply fail-closed contract: PASS");'

      - name: Verify Cloudflare production secret bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler secret list --name qvapay-ai-scanner > cloudflare-secret-list.json
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("cloudflare-secret-list.json","utf8")); const names=(Array.isArray(d)?d:d?.secrets??[]).map(s=>s?.name).filter(Boolean); for (const required of ["AUTH_USERNAME","AUTH_PASSWORD"]) if (!names.includes(required)) throw new Error("Required Cloudflare production secret is missing: "+required); console.log("Required authentication secret names are present in Cloudflare.");'

      - name: Reconcile legacy D1 migration baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          baseline_json="$(npx wrangler d1 execute qvapay-ai-scanner --remote --json --command "SELECT (SELECT COUNT(*) FROM d1_migrations WHERE name = '0008_market_event_timestamp_policy.sql') AS recorded, (SELECT COUNT(*) FROM pragma_table_info('market_events') WHERE name IN ('source_event_at','source_observed_at','timestamp_quality','quarantined')) AS columns_present, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_market_events_quarantine') AS index_present;")"
          node -e '
            const data = JSON.parse(process.argv[1]);
            const row = data?.[0]?.results?.[0];
            if (!row) throw new Error("Could not inspect the legacy D1 migration baseline.");
            const recorded = Number(row.recorded);
            const columnsPresent = Number(row.columns_present);
            const indexPresent = Number(row.index_present);
            if (recorded === 1) {
              console.log("Legacy migration 0008 is already recorded.");
              process.exit(0);
            }
            if (columnsPresent !== 4 || indexPresent !== 1) {
              throw new Error("Migration 0008 is unrecorded and its schema effects are incomplete; refusing to mark it applied.");
            }
            console.log("Migration 0008 schema effects are already present; reconciliation is required before applying remaining migrations.");
          ' "$baseline_json"
          npx wrangler d1 execute qvapay-ai-scanner --remote --command "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0008_market_event_timestamp_policy.sql');"

      - name: Apply D1 migrations to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply qvapay-ai-scanner --remote

      - name: Reconcile legacy D1 migration baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          baseline_json="$(npx wrangler d1 execute qvapay-ai-scanner --remote --json --command "SELECT (SELECT COUNT(*) FROM d1_migrations WHERE name = '0008_market_event_timestamp_policy.sql') AS recorded, (SELECT COUNT(*) FROM pragma_table_info('market_events') WHERE name IN ('source_event_at','source_observed_at','timestamp_quality','quarantined')) AS columns_present;")"
          node -e '
            const data = JSON.parse(process.argv[1]);
            const row = data?.[0]?.results?.[0];
            if (!row) throw new Error("Could not inspect the legacy D1 migration baseline.");
            console.log(JSON.stringify(row));
            const recorded = Number(row.recorded);
            const columnsPresent = Number(row.columns_present);
            if (recorded === 1) {
              console.log("Legacy migration 0008 is already recorded.");
              process.exit(0);
            }
            if (columnsPresent !== 4) {
              throw new Error("Migration 0008 is unrecorded and its schema effects are incomplete; refusing to mark it applied.");
            }
            console.log("Migration 0008 columns are already present; recording the legacy schema baseline before remaining migrations.");
          ' "$baseline_json"
          npx wrangler d1 execute qvapay-ai-scanner --remote --command "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0008_market_event_timestamp_policy.sql');"

      - name: Apply D1 migrations to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply qvapay-ai-scanner --remote

      - name: Deploy Worker with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy

      - name: Verify new active production version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          previous="$(cat cloudflare-previous-version.txt)"
          for attempt in {1..30}; do
            npx wrangler deployments status --name qvapay-ai-scanner --json > deployment-status.json
            active="$(node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("deployment-status.json","utf8")); const a=(d.versions??[]).filter(v=>Number(v?.percentage)===100).map(v=>v?.version_id).filter(Boolean); process.stdout.write(a.length===1?a[0]:"");')"
            if [ -n "$active" ] && { [ -z "$previous" ] || [ "$active" != "$previous" ]; }; then
              echo "Cloudflare version $active is the new single active version at 100%."
              {
                echo "github_commit=$GITHUB_SHA"
                echo "cloudflare_previous_version_id=$previous"
                echo "cloudflare_active_version_id=$active"
                echo "deployment_method=wrangler_direct"
              } > deployment-evidence.txt
              exit 0
            fi
            echo "Waiting for new active version (attempt $attempt/30; previous=$previous; active=$active)."
            sleep 10
          done
          echo "Cloudflare did not expose a new single 100% active version after deployment."
          exit 1

      - name: Verify production authentication configuration
        env:
          SMOKE_BASE_URL: https://qvapay-ai-scanner.osleyder-gonzalez1985.workers.dev
        run: npm run smoke:cloudflare:production:auth-config

      - name: Verify production arbitrage monitor and snapshot
        env:
          AI_AUDITOR_TOKEN: ${{ secrets.AI_AUDITOR_TOKEN }}
          AI_AUDITOR_BASE_URL: https://qvapay-ai-scanner.osleyder-gonzalez1985.workers.dev
        run: |
          set -euo pipefail
          if [ -z "${AI_AUDITOR_TOKEN}" ]; then
            echo "Missing required repository secret: AI_AUDITOR_TOKEN" >&2
            exit 1
          fi
          mkdir -p production-monitor-evidence
          for attempt in {1..6}; do
            curl --fail-with-body --silent --show-error --location --connect-timeout 5 --max-time 20 \
              --header "Authorization: Bearer ${AI_AUDITOR_TOKEN}" \
              --header "Accept: application/json" \
              --output production-monitor-evidence/health.json \
              "${AI_AUDITOR_BASE_URL}/api/ai-audit/health"
            curl --fail-with-body --silent --show-error --location --connect-timeout 5 --max-time 20 \
              --header "Authorization: Bearer ${AI_AUDITOR_TOKEN}" \
              --header "Accept: application/json" \
              --output production-monitor-evidence/monitor.json \
              "${AI_AUDITOR_BASE_URL}/api/ai-audit/monitor"
            node --input-type=module -e '
              import fs from "node:fs";
              const health=JSON.parse(fs.readFileSync("production-monitor-evidence/health.json","utf8"));
              const monitor=JSON.parse(fs.readFileSync("production-monitor-evidence/monitor.json","utf8"));
              const running=monitor?.ok===true && monitor?.state?.status==="running" && Boolean(monitor?.state?.scannedAt);
              const snapshot=Number.isInteger(monitor?.snapshot?.marketOffers) && Number.isInteger(monitor?.snapshot?.opportunities) && monitor.snapshot.marketOffers > 0;
              const database=health?.checks?.database?.ok===true;
              console.log(JSON.stringify({database: health?.checks?.database, monitor: monitor?.state, snapshot: monitor?.snapshot}, null, 2));
              if(database && running && snapshot) process.exit(0);
              process.exit(2);
            ' && break
            if [ "${attempt}" -eq 6 ]; then
              echo "Production arbitrage monitor did not reach a healthy scanned state." >&2
              exit 1
            fi
            sleep 10
          done
          unset AI_AUDITOR_TOKEN
      - name: Publish monitor failure diagnostic
        if: failure()
        id: monitor_failure_diagnostic
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > monitor-failure-summary.txt
          import fs from "node:fs";
          const read = (path) => {
            try { return JSON.parse(fs.readFileSync(path, "utf8")); } catch { return {}; }
          };
          const monitor = read("production-monitor-evidence/monitor.json");
          const arbitrage = read("production-monitor-evidence/arbitrage.json");
          const state = monitor?.state ?? {};
          const lastError = typeof state.lastError === "string" ? state.lastError : "";
          const upstream = lastError.match(/QvaPay HTTP (\d+)/)?.[1] ?? "none";
          const code = lastError.match(/\b([A-Z][A-Z0-9_]{3,})\b/)?.[1] ?? "none";
          const summary = [
            "status=" + String(state.status ?? "unknown"),
            "upstream_http=" + upstream,
            "error_code=" + code,
            "scanned_at=" + String(state.scannedAt ?? "none"),
            "market_offers=" + String(arbitrage?.marketOffers?.length ?? 0),
            "opportunities=" + String(arbitrage?.opportunities?.length ?? 0),
          ].join(";");
          console.log(summary);
          NODE
          echo "summary=$(cat monitor-failure-summary.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload monitor failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-monitor-failure-${{ steps.monitor_failure_diagnostic.outputs.summary }}
          path: monitor-failure-summary.txt
          retention-days: 7

      - name: Upload production monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-monitor-${{ github.sha }}
          path: production-monitor-evidence/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload production deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-deployment-${{ github.sha }}
          path: |
            deployment-before.json
            cloudflare-previous-version.txt
            deployment-status.json
            deployment-evidence.txt
          if-no-files-found: warn
