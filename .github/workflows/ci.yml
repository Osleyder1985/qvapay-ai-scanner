name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/post-remediation-ci-verification

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply repository formatting
        run: |
          npx prettier --write "src/**/*.ts" "package.json" "tsconfig.json"
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json tsconfig.json
          git commit -m "style: apply Prettier formatting"
          git push origin HEAD:chore/post-remediation-ci-verification

      - name: Quality gates
        run: npm run quality
