name: CI

on:
  push:
    branches: ["main", "production/cloudflare"]
  pull_request:
    branches: ["main", "production/cloudflare"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Quality gates
        run: npm run quality
