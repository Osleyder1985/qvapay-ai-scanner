name: CI

on:
  push:
    branches:
      - production/cloudflare
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/cloudflare/arbitrage-event-ingestion.ts src/cloudflare/arbitrage-history-routes.ts
      - name: Export formatted content
        run: |
          echo "EVENT_INGESTION_BEGIN"
          base64 -w0 src/cloudflare/arbitrage-event-ingestion.ts
          echo
          echo "EVENT_INGESTION_END"
          echo "HISTORY_ROUTES_BEGIN"
          base64 -w0 src/cloudflare/arbitrage-history-routes.ts
          echo
          echo "HISTORY_ROUTES_END"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Node.js support contract
        run: |
          node -e "const p=require('./package.json'); const range=p.engines?.node; if (range !== '>=22') { console.error('Expected package.json engines.node to be >=22; found:', range); process.exit(1); } if (Number(process.versions.node.split('.')[0]) < 22) { console.error('CI Node.js runtime is below the supported major version:', process.versions.node); process.exit(1); }"
      - name: Verify source documentation language
        run: node scripts/check-source-language.mjs
      - name: Diagnose Prettier formatting
        run: |
          npx prettier --write "src/**/*.ts" "package.json" "tsconfig.json"
          git diff -- src/cloudflare/arbitrage-event-ingestion.ts src/cloudflare/arbitrage-history-routes.ts
      - name: Run quality gates
        run: npm run quality

  cloudflare-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Cloudflare local runtime smoke
        run: npm run smoke:cloudflare:local
