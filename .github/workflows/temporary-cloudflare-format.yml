name: Temporary Cloudflare formatting

on:
  push:
    branches:
      - feat/cloudflare-auto-apply-executor

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "src/**/*.ts" "package.json" "tsconfig.json"
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/cloudflare/cloudflare-auto-apply-executor.ts src/backend/cloudflare/d1-repository.ts src/tests/cloudflare-auto-apply-executor.test.ts
          git commit -m "style: apply Prettier formatting"
          git push
